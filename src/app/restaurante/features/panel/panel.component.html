<h1 class="mb-4 text-2xl font-semibold text-ink">Panel</h1>

<div class="mb-4 grid grid-cols-1 gap-4 sm:grid-cols-2">
  <div class="rounded-xl border border-line bg-surface-2 p-4">
    <p class="text-sm text-ink-muted">Mesas abiertas</p>
    <p class="mt-1 text-2xl font-semibold text-ink">—</p>
  </div>
  <div class="rounded-xl border border-line bg-surface-2 p-4">
    <p class="text-sm text-ink-muted">Comensales actuales</p>
    <p class="mt-1 text-2xl font-semibold text-ink">—</p>
  </div>
</div>

<p class="mb-2 text-sm font-medium text-ink-muted">Hoy</p>
<div class="mb-4 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
  @for (kpi of ['Facturación de hoy', 'Ventas', 'Comensales atendidos', 'Ticket promedio']; track kpi) {
    <div class="rounded-xl border border-line bg-surface-2 p-4">
      <p class="text-sm text-ink-muted">{{ kpi }}</p>
      <p class="mt-1 text-2xl font-semibold text-ink">—</p>
    </div>
  }
</div>

<div class="rounded-xl border border-line bg-surface-2 p-6 text-center text-ink-muted">
  Las métricas se calculan una vez que exista el módulo de Órdenes/Ventas (ver
  <code class="rounded bg-surface-3 px-1">backend/PROYECTO.md</code>, pendientes).
</div>
