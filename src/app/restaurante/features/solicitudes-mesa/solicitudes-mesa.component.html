<div class="mb-4 flex items-center justify-between">
  <h1 class="text-2xl font-semibold text-ink">Solicitudes de Mesa</h1>
  <p class="text-xs text-ink-muted">Se actualiza solo cada 5 segundos</p>
</div>

<div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
  @for (s of autopedidoService.solicitudes(); track s.id) {
    <div class="flex items-center justify-between rounded-xl border border-line bg-surface-2 p-4">
      <div>
        <p class="font-semibold text-ink">{{ etiqueta(s.tipo) }}</p>
        <p class="text-sm text-ink-muted">Mesa {{ s.mesaNombre }} · hace {{ minutosTranscurridos(s.fecha) }} min</p>
      </div>
      <button type="button" class="rounded-lg bg-brand-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-brand-700" (click)="atender(s)">
        Atender
      </button>
    </div>
  }
  @if (!autopedidoService.solicitudes().length) {
    <div class="col-span-full rounded-xl border border-line bg-surface-2 px-4 py-10 text-center text-ink-muted">
      No hay solicitudes pendientes.
    </div>
  }
</div>
